function getRoute() {
  const hash = window.location.hash.replace("#","");
  if (hash.startsWith("restaurant/")) return { view: "restaurant", slug: hash.replace("restaurant/","") };
  if (hash.startsWith("track/")) return { view: "track", orderId: hash.replace("track/","") };
  if (hash === "track") return { view: "track", orderId: "" };
  if (hash === "dashboard") return { view: "dashboard" };
  if (hash === "request") return { view: "request" };
  if (hash === "drive") return { view: "drive" };
  if (hash === "partner") return { view: "partner" };
  return { view: "home" };
}

const DELIVERY_TOWNS = [

// Canaan and its immediate cluster count as "base" — a pickup from base is a single trip.
const BASE_TOWNS = ["Canaan","North Canaan","East Canaan","Falls Village"];
// Route-based fee calculator.
// Rules: same town = that town's fee. Base pickup = drop-off town's fee.
// Outside town -> different town (dual trip) = higher town's fee + half the lower town's fee.
function calcRouteFee(pickupTown, dropoffTown) {
  const p = DELIVERY_TOWNS.find(t=>t.town===pickupTown);
  const d = DELIVERY_TOWNS.find(t=>t.town===dropoffTown);
  if (!d) return null;
  // If pickup unknown, just use drop-off fee (safe fallback)
  if (!p) return d.fee;
  // Same town
  if (pickupTown === dropoffTown) return d.fee;
  // Pickup is base (Canaan cluster) -> single trip, drop-off fee only
  if (BASE_TOWNS.includes(pickupTown)) return d.fee;
  // Dual trip: higher fee + half the lower fee
  const hi = Math.max(p.fee, d.fee);
  const lo = Math.min(p.fee, d.fee);
  return hi + Math.round(lo/2);
}

let audioCtx = null;
function unlockAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === "suspended") audioCtx.resume();
}
function playChime() {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === "suspended") audioCtx.resume();
    const now = audioCtx.currentTime;
    [[523,0],[659,0.18],[784,0.36]].forEach(([freq, delay]) => {
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.connect(g); g.connect(audioCtx.destination);
      o.type = "sine";
      o.frequency.setValueAtTime(freq, now + delay);
      g.gain.setValueAtTime(0, now + delay);
      g.gain.linearRampToValueAtTime(0.5, now + delay + 0.01);
      g.gain.exponentialRampToValueAtTime(0.001, now + delay + 0.4);
      o.start(now + delay);
      o.stop(now + delay + 0.5);
    });
  } catch(e) { console.log("Audio error:", e); }
}

const cream="#F9F5EE", ink="#1A1612", rust="#C0392B", muted="#7A7065", border="#DDD5C8", green="#27AE60";

function App() {
  const [route, setRoute] = useState(getRoute());
  const [authed, setAuthed] = useState(!!sessionStorage.getItem("dm_authed"));
  useEffect(() => {
    const handler = () => setRoute(getRoute());
    window.addEventListener("hashchange", handler);
    return () => window.removeEventListener("hashchange", handler);
  }, []);
  const navigate = (hash) => { window.location.hash = hash; };
  if (route.view === "restaurant") {
    const restaurant = RESTAURANTS[route.slug];
    if (!restaurant) return <NotFound/>;
    return <RestaurantPortal restaurant={restaurant} slug={route.slug}/>;
  }
  if (route.view === "request") return <CustomerRequest navigate={navigate}/>;
  if (route.view === "drive") return <DriverSignup navigate={navigate}/>;
  if (route.view === "partner") return <PartnerPage navigate={navigate}/>;
  if (route.view === "track") return <TrackingPage navigate={navigate} initialOrderId={route.orderId || ""}/>;
  if (route.view === "home") return <LandingPage navigate={navigate}/>;
  if (route.view === "dashboard") {
    if (!authed) return <PinEntry onSuccess={() => { sessionStorage.setItem("dm_authed","1"); setAuthed(true); }}/>;
    return <Dashboard navigate={navigate}/>;
  }
  return <LandingPage navigate={navigate}/>;
}

function Dashboard({ navigate }) {
  const [orders, setOrders] = useState([]);

  const [loading, setLoading] = useState(true);
  const [tab, setTab] = useState("orders");
  const [audioUnlocked, setAudioUnlocked] = useState(false);
  const [ratingOrder, setRatingOrder] = useState(null);
  const [available, setAvailable] = useState(true);
  const knownIds = useRef(new Set());

  const loadOrders = async () => {
    try {
      const data = await sb.getOrders();
      const newPendingOrders = data.filter(o => o.status === "pending" && !knownIds.current.has(o.id));
      if (knownIds.current.size > 0 && newPendingOrders.length > 0) { playChime(); }
      data.forEach(o => knownIds.current.add(o.id));
      setOrders(data);
    } catch(e) {}
    finally { setLoading(false); }
  };

  useEffect(() => {
    loadOrders();
    const t = setInterval(loadOrders, 15000);
    return () => clearInterval(t);
  }, []);

  useEffect(() => { sb.getAvailability().then(setAvailable).catch(()=>{}); }, []);

  const toggleAvailable = async () => {
    const next = !available;
    setAvailable(next);
    try { await sb.setAvailability(next); } catch(e) { setAvailable(!next); alert("Could not update status."); }
  };

  const updateStatus = async (id, newStatus) => {
    try {
      await sb.updateOrder(id, { status: newStatus });
      setOrders(prev => prev.map(o => o.id===id ? {...o, status:newStatus} : o));
      if (newStatus === "active") {
        const order = orders.find(o=>o.id===id);
        if (order) sendSMS(order.customer_phone, "Hi "+order.customer_name+"! Your order from "+order.restaurant_name+" is on the way. Track: "+window.location.origin+"#track");
      }
    } catch(e) { alert("Failed to update."); }
  };

  const filtered = filter==="all" ? orders : orders.filter(o=>o.status===filter);
  const pending = orders.filter(o=>o.status==="pending").length;
  const active = orders.filter(o=>o.status==="active").length;

    pending:{bg:"#FFF3CD",text:"#856404",dot:"#FFC107"},

    active:{bg:"#D1ECF1",text:"#0C5460",dot:"#17A2B8"},

function PickupSpotsPanel() {
  const [locations, setLocations] = useState([]);
  const [loading, setLoading] = useState(true);
  const [name, setName] = useState("");
  const [address, setAddress] = useState("");
  const [saving, setSaving] = useState(false);

  const load = async () => {
    try { const data = await sb.getPickupLocations(); setLocations(data); } catch(e){} finally { setLoading(false); }
  };
  useEffect(()=>{ load(); },[]);

  const add = async () => {
    if (!name.trim() || !address.trim()) return;
    setSaving(true);
    try { await sb.createPickupLocation({ name: name.trim(), address: address.trim() }); setName(""); setAddress(""); await load(); }
    catch(e){ alert("Could not save location."); }
    finally { setSaving(false); }
  };

  const remove = async (id) => {
    if (!confirm("Remove this pickup location?")) return;
    try { await sb.deletePickupLocation(id); await load(); } catch(e){ alert("Could not delete."); }
  };

  const seedRestaurants = async () => {
    if (!confirm("Add your 8 DELIVERme restaurants to the pickup list? (Skips any already added.)")) return;
    setSaving(true);
    try {
      const existing = await sb.getPickupLocations();
      const existingNames = existing.map(l=>l.name.toLowerCase());
      const toAdd = Object.entries(RESTAURANTS).filter(([slug])=>slug!=="general").map(([slug,r])=>r).filter(r=>!existingNames.includes(r.name.toLowerCase()));
      for (const r of toAdd) { await sb.createPickupLocation({ name: r.name, address: r.address }); }
      await load();
      alert(toAdd.length>0 ? ("Added "+toAdd.length+" restaurant(s)!") : "All restaurants are already in your list.");
    } catch(e){ alert("Could not add restaurants."); }
    finally { setSaving(false); }
  };

  return (
    <div className="fade-in">
      <div style={{marginBottom:16}}>
        <h2 style={{fontSize:20,fontWeight:900}}>📍 Pickup Spots</h2>
        <p style={{fontSize:13,color:muted,marginTop:4}}>Saved pickup locations. These appear as a dropdown on the customer request form so addresses are always complete and correct.</p>

      <div className="card" style={{marginBottom:16}}>
        <p style={{fontSize:11,letterSpacing:".1em",textTransform:"uppercase",color:muted,marginBottom:10,fontWeight:700}}>Add a Pickup Spot</p>
        <div style={{display:"flex",flexDirection:"column",gap:10}}>
          <input value={name} onChange={e=>setName(e.target.value)} placeholder="Name (e.g. McDonald's, CVS)" style={{width:"100%",padding:"10px 12px",border:"1px solid "+border,borderRadius:4,fontSize:14,background:cream,outline:"none"}}/>
          <input value={address} onChange={e=>setAddress(e.target.value)} placeholder="Full address" style={{width:"100%",padding:"10px 12px",border:"1px solid "+border,borderRadius:4,fontSize:14,background:cream,outline:"none"}}/>
          <button onClick={add} disabled={saving||!name.trim()||!address.trim()} style={{background:(saving||!name.trim()||!address.trim())?"#ccc":rust,color:"white",border:"none",padding:"11px",borderRadius:6,cursor:"pointer",fontWeight:700,fontSize:14}}>{saving?"Saving...":"+ Add Location"}</button>
        </div>
        <button onClick={seedRestaurants} disabled={saving} style={{marginTop:10,width:"100%",background:"none",color:ink,border:"1px dashed "+border,padding:"10px",borderRadius:6,cursor:"pointer",fontWeight:600,fontSize:12}}>🍴 Quick-add my 8 DELIVERme restaurants</button>
      </div>

      {loading && <div style={{textAlign:"center",padding:"20px",color:muted}}>Loading...</div>}
      {!loading && locations.length===0 && <div style={{textAlign:"center",padding:"30px",color:muted,fontSize:13}}>No pickup spots yet. Add your first one above.</div>}
      <div style={{display:"flex",flexDirection:"column",gap:8}}>
        {locations.map(loc=>(
          <div key={loc.id} className="card" style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:10}}>
            <div style={{flex:1}}>
              <div style={{fontWeight:700,fontSize:14}}>{loc.name}</div>
              <div style={{fontSize:12,color:muted,marginTop:2}}>{loc.address}</div>

            <button onClick={()=>remove(loc.id)} style={{background:"none",color:"#DC3545",border:"1px solid #DC3545",padding:"6px 12px",borderRadius:4,cursor:"pointer",fontSize:12,fontWeight:600,whiteSpace:"nowrap"}}>Remove</button>
          </div>
        ))}

}

function EarningsPanel() {
  const [orders, setOrders] = useState([]);
  const [loading, setLoading] = useState(true);
  const [period, setPeriod] = useState("week");
  useEffect(()=>{ sb.getOrders().then(data=>{ setOrders(data.filter(o=>o.status==="paid")); setLoading(false); }).catch(()=>setLoading(false)); },[]);
  const now = new Date();
  const startOf = (p) => {
    const d = new Date(now);
    if(p==="today") { d.setHours(0,0,0,0); return d; }
    if(p==="week") { d.setDate(d.getDate()-d.getDay()); d.setHours(0,0,0,0); return d; }
    if(p==="month") { d.setDate(1); d.setHours(0,0,0,0); return d; }
    return new Date(0);
  };
  const filtered = orders.filter(o => new Date(o.created_at) >= startOf(period));
  const total = filtered.reduce((sum, o) => sum + Number(o.delivery_fee || 8), 0);
  const count = filtered.length;
  const avg = count > 0 ? total / count : 0;
  const byDay = {};
  filtered.forEach(o => {
    const day = new Date(o.created_at).toLocaleDateString("en-US", {weekday:"short", month:"short", day:"numeric"});
    if (!byDay[day]) byDay[day] = { count: 0, total: 0 };
    byDay[day].count++;
    byDay[day].total += Number(o.delivery_fee || 8);
  });
  const days = Object.entries(byDay).reverse();
  return (
    <div className="fade-in">
      <div style={{marginBottom:16}}>
        <h2 style={{fontSize:20,fontWeight:900}}>💵 Earnings</h2>
        <p style={{fontSize:13,color:muted,marginTop:4}}>Based on paid orders</p>
      </div>
      <div style={{display:"flex",gap:6,marginBottom:16}}>
        {[{val:"today",label:"Today"},{val:"week",label:"This Week"},{val:"month",label:"This Month"},{val:"all",label:"All Time"}].map(p=>(
          <button key={p.val} onClick={()=>setPeriod(p.val)} style={{flex:1,padding:"8px 4px",border:"1px solid "+(period===p.val?ink:border),background:period===p.val?ink:"white",color:period===p.val?"white":muted,borderRadius:4,cursor:"pointer",fontSize:11,fontWeight:600}}>{p.label}</button>
        ))}
      </div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:10,marginBottom:16}}>

function RatingsPanel() {
  const [ratings, setRatings] = useState([]);
  const [loading, setLoading] = useState(true);
  useEffect(()=>{ sb.getRatings().then(data=>{ setRatings(data); setLoading(false); }).catch(()=>setLoading(false)); },[]);
  const byRestaurant = {};
  ratings.forEach(r => { if (!byRestaurant[r.restaurant_name]) byRestaurant[r.restaurant_name] = []; byRestaurant[r.restaurant_name].push(r.rating); });
  const restaurantStats = Object.entries(byRestaurant).map(([name, ratingsList]) => {
    const avg = ratingsList.reduce((a,b)=>a+b,0) / ratingsList.length;
    return { name, avg, count: ratingsList.length };
  }).sort((a,b)=>b.avg-a.avg);
  const stars = (avg) => { const full = Math.round(avg); return "⭐".repeat(full) + (full < 5 ? "☆".repeat(5-full) : ""); };
  const label = (avg) => {
    if(avg>=4.5) return {text:"Excellent tipper", color:"#27AE60"};
    if(avg>=3.5) return {text:"Good tipper", color:"#2980B9"};
    if(avg>=2.5) return {text:"Average", color:"#F39C12"};
    if(avg>=1.5) return {text:"Rarely tips", color:"#E67E22"};
    return {text:"Never tips", color:"#DC3545"};
  };
  return (
    <div className="fade-in">
      <div style={{marginBottom:16}}>
        <h2 style={{fontSize:20,fontWeight:900}}>⭐ Restaurant Ratings</h2>
        <p style={{fontSize:13,color:"#7A7065",marginTop:4}}>Private — only you can see this</p>
      </div>
      {loading && <div style={{textAlign:"center",padding:"40px 0",color:"#7A7065"}}>Loading...</div>}
      {!loading && restaurantStats.length===0 && (<div style={{textAlign:"center",padding:"40px 0",color:"#7A7065",fontSize:13}}>No ratings yet. Rate restaurants after marking orders paid.</div>)}
      <div style={{display:"flex",flexDirection:"column",gap:10}}>
        {restaurantStats.map(r=>{
          const l = label(r.avg);
          return (
            <div key={r.name} className="card">
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                <div>
                  <div style={{fontWeight:700,fontSize:15,marginBottom:4}}>{r.name}</div>
                  <div style={{fontSize:16}}>{stars(r.avg)}</div>
                  <div style={{fontSize:12,marginTop:4,color:l.color,fontWeight:600}}>{l.text}</div>
                </div>
                <div style={{textAlign:"right"}}>
                  <div style={{fontSize:24,fontWeight:900,color:l.color}}>{r.avg.toFixed(1)}</div>
                  <div style={{fontSize:11,color:"#7A7065"}}>{r.count} order{r.count!==1?"s":""}</div>

                {order.status !== "cancelled" && (

  );
}

function CustomerRequest({ navigate }) {
  const [form, setForm] = useState({ customerName:"", customerPhone:"", pickupName:"", pickupAddress:"", dropoffAddress:"", orderDetails:"", notes:"" });
  const [dropoffTown, setDropoffTown] = useState(null); // selected town object {town,fee} or "__other__"

  useEffect(() => { sb.getAvailability().then(setAvailable).catch(()=>setAvailable(true)); }, []);
  useEffect(() => { sb.getPickupLocations().then(setPickupSpots).catch(()=>setPickupSpots([])); }, []);
  const handleChange = e => setForm(prev => ({...prev, [e.target.name]: e.target.value}));
  const isOutOfArea = dropoffTown === "__other__";
  const townSelected = dropoffTown && dropoffTown !== "__other__";
  const pickupTownSelected = pickupTown && pickupTown !== "__other__";
  // Route-based fee: needs both pickup and drop-off town. Falls back to drop-off fee if pickup not chosen.
  const deliveryFee = (townSelected && pickupTownSelected) ? calcRouteFee(pickupTown.town, dropoffTown.town) : (townSelected ? dropoffTown.fee : 8);
  // An address is considered complete if it has a street number (a digit) and is reasonably long.
  const addressComplete = (addr) => { const a=(addr||"").trim(); return a.length>=6 && /\d/.test(a); };
  const pickupOk = addressComplete(form.pickupAddress);
  const dropoffOk = addressComplete(form.dropoffAddress);
  const submit = async () => {
    if (!form.customerName || !form.customerPhone || !form.pickupAddress || !form.dropoffAddress) return;
    if (!townSelected || !pickupTownSelected) return;
    if (!pickupOk || !dropoffOk) return;
    setLoading(true);
    try {
      const pickupDisplayName = form.pickupName==="__other__" ? (form.pickupNameOther||"Customer Request") : (form.pickupName||"Customer Request");
      // Build full GPS-ready addresses: "street, Town, ST" (town label may already include state)
      const dropTownLabel = dropoffTown.town.includes(",") ? dropoffTown.town : (dropoffTown.town + ", " + dropoffTown.state);
      const pickTownLabel = pickupTown.town.includes(",") ? pickupTown.town : (pickupTown.town + ", " + pickupTown.state);
      const fullDropoff = form.dropoffAddress.includes(pickTownLabel)||form.dropoffAddress.includes(dropTownLabel) ? form.dropoffAddress : form.dropoffAddress + ", " + dropTownLabel;
      const fullPickup = form.pickupAddress.includes(pickTownLabel) ? form.pickupAddress : form.pickupAddress + ", " + pickTownLabel;
      const routeFee = calcRouteFee(pickupTown.town, dropoffTown.town);
      const order = { restaurant_name: pickupDisplayName, restaurant_address: fullPickup, customer_name: form.customerName, customer_phone: form.customerPhone, dropoff_address: fullDropoff, order_details: form.orderDetails, notes: form.notes, delivery_fee: routeFee, status: "pending", created_at: new Date().toISOString() };
      const [created] = await sb.createOrder(order);
      setOrderId(created.id);
      sendSMS("+19296908573","🚗 New customer request!\nFrom: "+(pickupDisplayName)+" ("+pickupTown.town+")\nPickup: "+fullPickup+"\nTo: "+dropoffTown.town+" ($"+routeFee+")\nCustomer: "+form.customerName+" ("+form.customerPhone+")\nDrop-off: "+fullDropoff);
      setSubmitted(true);
    } catch(e) { alert("Error submitting. Please try again."); }
    finally { setLoading(false); }
  };
  if (submitted) return (
    <div style={{fontFamily:"system-ui,sans-serif",background:cream,minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",padding:24}}>

        <h2 style={{fontSize:24,fontWeight:900,color:ink,marginBottom:8}}>Request Sent!</h2>
        <p style={{color:muted,fontSize:14,marginBottom:4}}>Your driver has been notified and will confirm shortly.</p>
        {orderId && (<div style={{background:"white",border:"1px solid #DDD5C8",borderRadius:8,padding:16,marginTop:16,marginBottom:24}}><p style={{fontSize:12,color:muted,marginBottom:4}}>Your Order ID</p><p style={{fontSize:20,fontWeight:900,color:rust}}>{orderId.slice(0,8).toUpperCase()}</p><p style={{fontSize:12,color:muted,marginTop:4}}>Save this to track your delivery</p></div>)}
        <button onClick={()=>navigate("track/"+orderId.slice(0,8).toUpperCase())} style={{width:"100%",background:ink,color:"white",border:"none",padding:"14px",borderRadius:6,cursor:"pointer",fontWeight:700,fontSize:15,marginBottom:10}}>📍 Track My Order</button>
        <button onClick={()=>{setSubmitted(false);setForm({customerName:"",customerPhone:"",pickupName:"",pickupAddress:"",dropoffAddress:"",orderDetails:"",notes:""});setDropoffTown(null);}} style={{width:"100%",background:"none",color:muted,border:"1px solid #DDD5C8",padding:"12px",borderRadius:6,cursor:"pointer",fontSize:13}}>New Request</button>
      </div>
    </div>
  );
  return (

          <label style={{display:"block",fontSize:11,letterSpacing:".1em",textTransform:"uppercase",color:muted,marginBottom:6}}>Order ID</label>
          <div style={{display:"flex",gap:10}}>
            <input value={orderId} onChange={e=>setOrderId(e.target.value)} onKeyDown={e=>e.key==="Enter"&&track()} placeholder="Enter your order ID" style={{flex:1,padding:"10px 12px",border:"1px solid #DDD5C8",borderRadius:4,fontSize:14,background:cream,outline:"none"}}/>
            <button onClick={()=>track()} disabled={loading||!orderId} style={{background:rust,color:"white",border:"none",padding:"10px 18px",borderRadius:4,cursor:"pointer",fontWeight:600,fontSize:13}}>{loading ? "..." : "Track"}</button>
          </div>
        </div>
        {tracked && (
          <>
            <div style={{background:"white",border:"1px solid #DDD5C8",borderRadius:8,padding:20,marginBottom:16}}>
              <div style={{marginBottom:16}}>
                <div style={{fontWeight:700,fontSize:16}}>{tracked.restaurant_name}</div>
                <div style={{fontSize:13,color:muted,marginTop:4}}>To: {tracked.dropoff_address}</div>
                <div style={{fontSize:13,color:muted}}>For: {tracked.customer_name}</div>
              </div>
              {steps.map((step,i) => {
                const done=i<stepIndex, active=i===stepIndex-1;
                return (
                  <div key={step} style={{display:"flex",alignItems:"center",gap:14}}>
                    <div style={{display:"flex",flexDirection:"column",alignItems:"center",width:20}}>
                      <div style={{width:20,height:20,borderRadius:"50%",background:done||active?rust:"#DDD5C8",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
                        {done && <span style={{color:"white",fontSize:10}}>✓</span>}
                        {active && <span style={{width:8,height:8,borderRadius:"50%",background:"white",display:"block"}}/>}
                      </div>
                      {i<steps.length-1 && <div style={{width:2,height:28,background:done?rust:"#DDD5C8"}}/>}
                    </div>
                    <div style={{paddingBottom:i<steps.length-1?20:0}}><div style={{fontSize:13,fontWeight:active?700:400,color:done||active?ink:muted}}>{step}</div></div>
                  </div>
                );
              })}
            </div>
            {!paid ? (
              <div style={{background:"white",border:"1px solid #DDD5C8",borderRadius:8,padding:20}}>
                <h3 style={{fontSize:16,fontWeight:700,marginBottom:16}}>💳 Pay Delivery Fee</h3>
                <div style={{display:"flex",justifyContent:"space-between",marginBottom:4}}>
                  <span style={{fontSize:14,color:muted}}>Delivery fee</span>
                  <span style={{fontSize:14,fontWeight:600}}>${DELIVERY_FEE.toFixed(2)}</span>
                </div>
                <div style={{borderTop:"1px solid #DDD5C8",paddingTop:12,marginBottom:16,marginTop:12}}>
                  <div style={{display:"flex",justifyContent:"space-between"}}>
                    <span style={{fontWeight:700,fontSize:15}}>Total</span>
                    <span style={{fontWeight:900,fontSize:18,color:rust}}>${DELIVERY_FEE.toFixed(2)}</span>
                  </div>
                  <p style={{fontSize:11,color:muted,marginTop:6}}>Want to tip? You can add a tip on the card screen, or hand it to your driver directly.</p>
                </div>
                <div style={{display:"flex",flexDirection:"column",gap:10}}>
                  {STRIPE_FEE_LINKS[DELIVERY_FEE] ? (
                    <button onClick={payWithStripe} style={{background:"#635BFF",color:"white",border:"none",padding:"14px",borderRadius:6,cursor:"pointer",fontWeight:700,fontSize:15}}>💳 Pay by Card / Apple Pay — ${DELIVERY_FEE.toFixed(2)}</button>
                  ) : (
                    <div style={{background:"#F0EDE6",border:"1px solid "+border,borderRadius:6,padding:12,textAlign:"center"}}>
                      <p style={{fontSize:13,color:muted,marginBottom:8}}>For this delivery amount, please pay by <strong>Venmo</strong>, <strong>Cash App</strong>, or <strong>cash</strong>:</p>
                      <div style={{display:"flex",gap:8,justifyContent:"center"}}>
                        <a href="https://venmo.com/Delivermeapp" target="_blank" style={{background:"#3D95CE",color:"white",textDecoration:"none",padding:"10px 16px",borderRadius:6,fontWeight:700,fontSize:14}}>Venmo</a>
                        <a href="https://cash.app/$Delivermeapp" target="_blank" style={{background:"#00C244",color:"white",textDecoration:"none",padding:"10px 16px",borderRadius:6,fontWeight:700,fontSize:14}}>Cash App</a>
                      </div>
                      <p style={{fontSize:11,color:muted,marginTop:8}}>@Delivermeapp · $Delivermeapp · send ${DELIVERY_FEE.toFixed(2)}</p>
                    </div>
                  )}
                  <button onClick={()=>setCashSelected(true)} style={{background:"white",color:ink,border:"2px solid "+ink,padding:"14px",borderRadius:6,cursor:"pointer",fontWeight:700,fontSize:15}}>💵 Pay Cash on Delivery</button>
                  {cashSelected && (
                    <div style={{background:"#FFF3CD",border:"1px solid #FFC107",borderRadius:6,padding:12,textAlign:"center"}}>
                      <p style={{fontWeight:700,color:"#856404"}}>💵 Cash selected</p>
                      <p style={{fontSize:13,color:"#856404",marginTop:4}}>Please have <strong>${DELIVERY_FEE.toFixed(2)}</strong> ready for the driver at drop-off.</p>
                    </div>
                  )}
                  <div style={{borderTop:"1px solid #DDD5C8",paddingTop:10,marginTop:4}}>
                    <p style={{fontSize:12,color:muted,textAlign:"center",marginBottom:8}}>After completing your card payment tap below</p>
                    <button onClick={()=>setPaid(true)} style={{width:"100%",background:"#27AE60",color:"white",border:"none",padding:"14px",borderRadius:6,cursor:"pointer",fontWeight:700,fontSize:15}}>✓ I've Completed My Payment</button>
                  </div>
                  <p style={{fontSize:11,color:muted,textAlign:"center"}}>Card accepts Apple Pay & Google Pay</p>
                </div>
              </div>
            ) : (
              <div style={{background:"#D4EDDA",border:"1px solid #C3E6CB",borderRadius:8,padding:20,textAlign:"center"}}>
                <div style={{fontSize:36,marginBottom:8}}>🎉</div>
                <p style={{fontWeight:700,color:"#155724",fontSize:16}}>Payment confirmed!</p>
                <p style={{color:"#155724",fontSize:13,marginTop:4}}>Thank you for using DELIVERme!</p>
              </div>
            )}
          </>
        )}
        {notFound && <p style={{textAlign:"center",color:muted,fontSize:13,paddingTop:16}}>No order found with that ID.</p>}
      </main>
    </div>
  );
}

function NotFound() {
  return (
    <div style={{fontFamily:"system-ui,sans-serif",background:cream,minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center"}}>
      <div style={{textAlign:"center"}}>
        <p style={{fontSize:48,marginBottom:16}}>🤷</p>
        <p style={{color:muted}}>Restaurant not found. Check your link.</p>
        <a href="#" style={{color:rust,fontSize:13,marginTop:12,display:"block"}}>← Go Home</a>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
</script>
</body>
</html>
