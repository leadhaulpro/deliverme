// ── URL routing ──────────────────────────────────────────────
function getRoute() {
  const hash = window.location.hash.replace("#","");
  if (hash.startsWith("restaurant/")) return { view: "restaurant", slug: hash.replace("restaurant/","") };
  if (hash.startsWith("track/")) return { view: "track", orderId: hash.replace("track/","") };
  if (hash === "track") return { view: "track", orderId: "" };
  if (hash === "dashboard") return { view: "dashboard" };
  return { view: "home" };
}

// ── Supabase ─────────────────────────────────────────────────
const sb = {
  async getOrders() {
    const res = await fetch(SUPABASE_URL+"/rest/v1/orders?order=created_at.desc", {
      headers: { apikey: SUPABASE_ANON_KEY, Authorization: "Bearer "+SUPABASE_ANON_KEY }
    });
    if (!res.ok) throw new Error("Failed");
    return res.json();
  },
  async createOrder(order) {
    const res = await fetch(SUPABASE_URL+"/rest/v1/orders", {
      method: "POST",
      headers: { apikey: SUPABASE_ANON_KEY, Authorization: "Bearer "+SUPABASE_ANON_KEY, "Content-Type": "application/json", Prefer: "return=representation" },
      body: JSON.stringify(order)
    });
    if (!res.ok) throw new Error("Failed");
    return res.json();
  },
  async updateOrder(id, updates) {
    const res = await fetch(SUPABASE_URL+"/rest/v1/orders?id=eq."+id, {
      method: "PATCH",
      headers: { apikey: SUPABASE_ANON_KEY, Authorization: "Bearer "+SUPABASE_ANON_KEY, "Content-Type": "application/json", Prefer: "return=representation" },
      body: JSON.stringify(updates)
    });
    if (!res.ok) throw new Error("Failed");
    return res.json();
  },
  async deleteOrder(id) {
    const res = await fetch(SUPABASE_URL+"/rest/v1/orders?id=eq."+id, {
      method: "DELETE",
      headers: { apikey: SUPABASE_ANON_KEY, Authorization: "Bearer "+SUPABASE_ANON_KEY }
    });
    if (!res.ok) throw new Error("Failed to delete");
  },
  async getOrderById(id) {
    const res = await fetch(SUPABASE_URL+"/rest/v1/orders?id=eq."+id, {
      headers: { apikey: SUPABASE_ANON_KEY, Authorization: "Bearer "+SUPABASE_ANON_KEY }
    });
    if (!res.ok) throw new Error("Failed");
    const data = await res.json();
    return data[0] || null;
  }
};

async function sendSMS(to, message) {

    await fetch(SUPABASE_URL+"/functions/v1/send-sms", {
      method: "POST",
      headers: { apikey: SUPABASE_ANON_KEY, Authorization: "Bearer "+SUPABASE_ANON_KEY, "Content-Type": "application/json" },
      body: JSON.stringify({ to, message })
    });
  } catch(e) {}
}

// ── Chime ─────────────────────────────────────────────────────
let audioCtx = null;
function unlockAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === "suspended") audioCtx.resume();
}
function playChime() {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === "suspended") audioCtx.resume();
    const now = audioCtx.currentTime;
    [[523,0],[659,0.18],[784,0.36]].forEach(([freq, delay]) => {
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.connect(g); g.connect(audioCtx.destination);
      o.type = "sine";
      o.frequency.setValueAtTime(freq, now + delay);
      g.gain.setValueAtTime(0, now + delay);
      g.gain.linearRampToValueAtTime(0.5, now + delay + 0.01);
      g.gain.exponentialRampToValueAtTime(0.001, now + delay + 0.4);
      o.start(now + delay);
      o.stop(now + delay + 0.5);
    });
  } catch(e) { console.log("Audio error:", e); }
}

// ── Styles ────────────────────────────────────────────────────
const cream="#F9F5EE", ink="#1A1612", rust="#C0392B", muted="#7A7065", border="#DDD5C8", green="#27AE60";

// ── App Root ──────────────────────────────────────────────────
function App() {
  const [route, setRoute] = useState(getRoute());
  const [authed, setAuthed] = useState(!!sessionStorage.getItem("dm_authed"));

  useEffect(() => {
    const handler = () => setRoute(getRoute());
    window.addEventListener("hashchange", handler);
    return () => window.removeEventListener("hashchange", handler);
  }, []);

  const navigate = (hash) => { window.location.hash = hash; };

  // Restaurant view — no auth needed
  if (route.view === "restaurant") {
    const restaurant = RESTAURANTS[route.slug];
    if (!restaurant) return <NotFound/>;
    return <RestaurantPortal restaurant={restaurant} slug={route.slug}/>;
  }

  // Track view — no auth needed
  if (route.view === "track") return <TrackingPage navigate={navigate} initialOrderId={route.orderId || ""}/>;

  // Home/landing page
  if (route.view === "home") return <LandingPage navigate={navigate}/>;

  // Dashboard — requires PIN
  if (route.view === "dashboard") {
    if (!authed) return <PinEntry onSuccess={() => { sessionStorage.setItem("dm_authed","1"); setAuthed(true); }}/>;
    return <Dashboard navigate={navigate}/>;
  }

  return <LandingPage navigate={navigate}/>;
}

}

// ── Driver Dashboard ──────────────────────────────────────────
function Dashboard({ navigate }) {
  const [orders, setOrders] = useState([]);
  const [filter, setFilter] = useState("all");
  const [loading, setLoading] = useState(true);
  const [tab, setTab] = useState("orders");
  const [audioUnlocked, setAudioUnlocked] = useState(false);

  const knownIds = useRef(new Set());

  const loadOrders = async () => {
    try {
      const data = await sb.getOrders();
      const newPendingOrders = data.filter(o => o.status === "pending" && !knownIds.current.has(o.id));
      if (knownIds.current.size > 0 && newPendingOrders.length > 0) {
        playChime();
      }
      data.forEach(o => knownIds.current.add(o.id));
      setOrders(data);
    } catch(e) {}
    finally { setLoading(false); }
  };

  useEffect(() => {
    loadOrders();
    const t = setInterval(loadOrders, 15000);
    return () => clearInterval(t);
  }, []);

  const updateStatus = async (id, newStatus) => {
    try {
      await sb.updateOrder(id, { status: newStatus });
      setOrders(prev => prev.map(o => o.id===id ? {...o, status:newStatus} : o));
      if (newStatus === "active") {
        const order = orders.find(o=>o.id===id);
        if (order) sendSMS(order.customer_phone, "Hi "+order.customer_name+"! Your order from "+order.restaurant_name+" is on the way. Track: "+window.location.origin+"#track");
      }
    } catch(e) { alert("Failed to update."); }
  };

  const filtered = filter==="all" ? orders : orders.filter(o=>o.status===filter);
  const pending = orders.filter(o=>o.status==="pending").length;
  const active = orders.filter(o=>o.status==="active").length;
  const delivered = orders.filter(o=>o.status==="delivered").length;

    pending:{bg:"#FFF3CD",text:"#856404",dot:"#FFC107"},
    ready_for_pickup:{bg:"#FFE8D6",text:"#B94A00",dot:"#FF6B1A"},
    active:{bg:"#D1ECF1",text:"#0C5460",dot:"#17A2B8"},
    picked_up:{bg:"#E8D5F5",text:"#6B1FA3",dot:"#9B59B6"},
    delivered:{bg:"#D4EDDA",text:"#155724",dot:"#28A745"},
    cancelled:{bg:"#F8D7DA",text:"#721C24",dot:"#DC3545"}
  };

    const d=Math.floor((Date.now()-new Date(iso))/1000);
    if(d<60) return d+"s ago";
    if(d<3600) return Math.floor(d/60)+"m ago";
    return Math.floor(d/3600)+"h ago";
  }

  return (
    <div style={{fontFamily:"system-ui,sans-serif",background:cream,minHeight:"100vh",color:ink}} onClick={unlockAudio}>

        *{box-sizing:border-box;margin:0;padding:0}

        .btn-red{background:${rust};color:white}

        .btn-outline{background:none;color:${ink};border:1px solid ${border}}
        .btn-outline:hover{border-color:${ink}}
        .tag{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600}
        .dot{width:6px;height:6px;border-radius:50%}
        @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
        .pulse{animation:pulse 1.8s infinite}
        @keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
        .fade-in{animation:fadeIn .25s ease}
      `}</style>
      <header style={{background:"white",borderBottom:"1px solid "+border,padding:"0 20px",height:52,display:"flex",alignItems:"center",justifyContent:"space-between",position:"sticky",top:0,zIndex:100}}>
        <div>
          <span style={{fontWeight:900,color:rust,fontSize:18}}>DELIVER</span>
          <span style={{fontWeight:700,color:ink,fontSize:18}}>me</span>
          <span style={{fontSize:11,color:muted,marginLeft:8,textTransform:"uppercase",letterSpacing:".08em"}}>Dashboard</span>
        </div>
        <div style={{display:"flex",gap:8}}>
          {!audioUnlocked ? (
            <button className="btn btn-red" style={{padding:"6px 12px",fontSize:11}} onClick={()=>{
              unlockAudio();
              playChime();
              setAudioUnlocked(true);
            }}>🔔 Enable Sound</button>
          ) : (
            <button className="btn btn-outline" style={{padding:"6px 12px",fontSize:11,borderColor:"#27AE60",color:"#27AE60"}} onClick={()=>{playChime();}}>🔔 ✓</button>

            🏪 Restaurants

        </div>

        {/* Restaurants Panel */}

              return (

                    <div>
                      <div style={{fontWeight:700,fontSize:15,marginBottom:2}}>{r.name}</div>
                      <div style={{fontSize:12,color:muted,marginBottom:6}}>{r.address}</div>
                      <div style={{fontSize:11,color:rust,wordBreak:"break-all"}}>{link}</div>

            <button key={f} onClick={()=>setFilter(f)} style={{padding:"5px 14px",fontSize:11,letterSpacing:".08em",textTransform:"uppercase",border:"1px solid "+(filter===f?ink:border),background:filter===f?ink:"transparent",color:filter===f?"white":muted,borderRadius:4,cursor:"pointer"}}>
              {f}

        </div>

        {loading && <div style={{textAlign:"center",padding:"40px 0",color:muted}}>Loading orders...</div>}

        <div style={{display:"flex",flexDirection:"column",gap:10}}>
          {!loading && filtered.length===0 && <div style={{textAlign:"center",padding:"40px 0",color:muted,fontSize:13}}>No orders here</div>}
          {filtered.map(order => {
            const sc = statusColors[order.status] || statusColors.pending;
            return (
              <div key={order.id} className="order-card fade-in">
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",flexWrap:"wrap",gap:10}}>
                  <div style={{flex:1,minWidth:200}}>

                        <button className="btn btn-outline" style={{padding:"7px 12px",fontSize:11,borderColor:"#DC3545",color:"#DC3545"}} onClick={async()=>{

                            try { await sb.deleteOrder(order.id); setOrders(prev=>prev.filter(o=>o.id!==order.id)); } catch(e){ alert("Failed to delete."); }
                          }
                        }}>🗑 Delete</button>
                      )}
                      {order.status!=="cancelled" && order.status!=="delivered" && (
                        <button className="btn btn-outline" style={{padding:"7px 12px",fontSize:11}} onClick={()=>{
                          const shortId = order.id.slice(0,8).toUpperCase();

                          const msg = `Hi ${order.customer_name}! Your order from ${order.restaurant_name} is on its way 🚗\n\nTrack your delivery here:\n${trackUrl}\n\nDelivery fee: $${Number(order.delivery_fee).toFixed(2)}\nPay via Venmo @Delivermeapp, CashApp $Delivermeapp, or cash at drop-off.`;
                          window.open(`sms:${order.customer_phone}?body=${encodeURIComponent(msg)}`);
                        }}>📲 Text Customer</button>
                      )}
                    </div>
                  </div>
                </div>
              </div>
            );
          })}
        </div>
        </>}
      </main>
    </div>
  );
}

function RestaurantPortal({ restaurant, slug }) {

  const savePrefMethod = (method) => {
    localStorage.setItem("dm_tip_method", method);

    const m = method || prefMethod;
    if(m === "venmo") window.open(`https://venmo.com/Delivermeapp?txn=pay&amount=${amount}&note=${encodeURIComponent("Tip for DELIVERme driver")}`, "_blank");
    else if(m === "cashapp") window.open(`https://cash.app/$Delivermeapp/${amount}`, "_blank");

  const restaurantName = form.restaurantName || restaurant.name;

    if (!restaurantName) return;
    try {
      const all = await sb.getOrders();
      const mine = all.filter(o => o.restaurant_name === restaurantName);

// ── Tracking Page ─────────────────────────────────────────────
function TrackingPage({ navigate, initialOrderId }) {
  const [orderId, setOrderId] = useState(initialOrderId || "");
  const [tracked, setTracked] = useState(null);
  const [loading, setLoading] = useState(false);
  const [notFound, setNotFound] = useState(false);
  const [tip, setTip] = useState(0);
  const [customTip, setCustomTip] = useState("");
  const [paid, setPaid] = useState(false);

  const DELIVERY_FEE = 8;
  const tipOptions = [1, 2, 3, 5];

  const track = async (id) => {
    const searchId = (id || orderId).trim();
    if (!searchId) return;
    setLoading(true); setNotFound(false); setTracked(null);
    try {
      const all = await sb.getOrders();
      const found = all.find(o => 
        o.id === searchId || 
        o.id.slice(0,8).toUpperCase() === searchId.toUpperCase()
      ) || null;
      found ? setTracked(found) : setNotFound(true);
    } catch { setNotFound(true); }
    finally { setLoading(false); }
  };

  useEffect(() => {
    if (initialOrderId) track(initialOrderId);
  }, []);

  const totalTip = customTip ? parseFloat(customTip) || 0 : tip;
  const total = DELIVERY_FEE + totalTip;

  const payWithStripe = async () => {
    const note = encodeURIComponent(`Order #${tracked.id.slice(0,8).toUpperCase()} - ${tracked.customer_name}`);
    window.open(`https://buy.stripe.com/3cI5kC81Z4IDeEe4Vgd3i00?prefilled_email=&client_reference_id=${tracked.id.slice(0,8)}&locale=auto`, "_blank");
  };

  const payVenmo = () => {
    const note = encodeURIComponent("DELIVERme delivery fee");
    window.open(`https://venmo.com/Delivermeapp?txn=pay&amount=${total}&note=${note}`, "_blank");
    setPaid(true);
  };

  const payCashApp = () => {
    const note = encodeURIComponent("DELIVERme delivery fee");
    window.open(`https://cash.app/$Delivermeapp/${total}`, "_blank");
    setPaid(true);
  };

  const steps = ["Order Received","Driver Accepted","Picked Up","On The Way","Delivered"];
  const stepIndex = !tracked ? 0 : tracked.status==="pending" ? 1 : tracked.status==="active" || tracked.status==="ready_for_pickup" ? 2 : tracked.status==="picked_up" ? 4 : tracked.status==="delivered" ? 5 : 0;

  return (
    <div style={{fontFamily:"system-ui,sans-serif",background:cream,minHeight:"100vh",color:ink}}>
      <style>{`*{box-sizing:border-box;margin:0;padding:0}`}</style>
      <header style={{background:"white",borderBottom:"1px solid #DDD5C8",padding:"14px 20px"}}>
        <div style={{maxWidth:480,margin:"0 auto",display:"flex",alignItems:"center",justifyContent:"space-between"}}>
          <div>
            <span style={{fontWeight:900,color:rust,fontSize:16}}>DELIVER</span>
            <span style={{fontWeight:700,color:ink,fontSize:16}}>me</span>
          </div>
          <button onClick={()=>navigate("")} style={{background:"none",border:"none",color:muted,fontSize:13,cursor:"pointer"}}>← Home</button>
        </div>
      </header>
      <main style={{maxWidth:480,margin:"0 auto",padding:"24px 16px"}}>
        <h1 style={{fontSize:24,fontWeight:900,marginBottom:20}}>Track Your Delivery</h1>
        <div style={{background:"white",border:"1px solid #DDD5C8",borderRadius:8,padding:20,marginBottom:16}}>
          <label style={{display:"block",fontSize:11,letterSpacing:".1em",textTransform:"uppercase",color:muted,marginBottom:6}}>Order ID</label>
          <div style={{display:"flex",gap:10}}>
            <input value={orderId} onChange={e=>setOrderId(e.target.value)} onKeyDown={e=>e.key==="Enter"&&track()} placeholder="Enter your order ID"
              style={{flex:1,padding:"10px 12px",border:"1px solid #DDD5C8",borderRadius:4,fontSize:14,background:cream,outline:"none"}}/>
            <button onClick={()=>track()} disabled={loading||!orderId}
              style={{background:rust,color:"white",border:"none",padding:"10px 18px",borderRadius:4,cursor:"pointer",fontWeight:600,fontSize:13}}>
              {loading ? "..." : "Track"}
            </button>
          </div>
        </div>

        {tracked && (
          <>
            <div style={{background:"white",border:"1px solid #DDD5C8",borderRadius:8,padding:20,marginBottom:16}}>
              <div style={{marginBottom:16}}>
                <div style={{fontWeight:700,fontSize:16}}>{tracked.restaurant_name}</div>
                <div style={{fontSize:13,color:muted,marginTop:4}}>To: {tracked.dropoff_address}</div>
                <div style={{fontSize:13,color:muted}}>For: {tracked.customer_name}</div>
              </div>
              {steps.map((step,i) => {
                const done=i<stepIndex, active=i===stepIndex-1;
                return (
                  <div key={step} style={{display:"flex",alignItems:"center",gap:14}}>
                    <div style={{display:"flex",flexDirection:"column",alignItems:"center",width:20}}>
                      <div style={{width:20,height:20,borderRadius:"50%",background:done||active?rust:"#DDD5C8",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
                        {done && <span style={{color:"white",fontSize:10}}>✓</span>}
                        {active && <span style={{width:8,height:8,borderRadius:"50%",background:"white",display:"block"}}/>}
                      </div>
                      {i<steps.length-1 && <div style={{width:2,height:28,background:done?rust:"#DDD5C8"}}/>}
                    </div>
                    <div style={{paddingBottom:i<steps.length-1?20:0}}>
                      <div style={{fontSize:13,fontWeight:active?700:400,color:done||active?ink:muted}}>{step}</div>
                    </div>
                  </div>
                );
              })}
            </div>

            {/* Payment Section */}
            {!paid ? (
              <div style={{background:"white",border:"1px solid #DDD5C8",borderRadius:8,padding:20}}>
                <h3 style={{fontSize:16,fontWeight:700,marginBottom:16}}>💳 Pay Delivery Fee</h3>
                <div style={{display:"flex",justifyContent:"space-between",marginBottom:4}}>
                  <span style={{fontSize:14,color:muted}}>Delivery fee</span>
                  <span style={{fontSize:14,fontWeight:600}}>${DELIVERY_FEE.toFixed(2)}</span>
                </div>

                <div style={{marginBottom:12,marginTop:12}}>
                  <p style={{fontSize:12,color:muted,marginBottom:8,letterSpacing:".05em",textTransform:"uppercase"}}>Add a tip</p>
                  <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
                    {tipOptions.map(t=>(
                      <button key={t} onClick={()=>{setTip(tip===t?0:t);setCustomTip("");}}
                        style={{padding:"8px 14px",border:"1px solid "+(tip===t?rust:"#DDD5C8"),background:tip===t?rust:"white",color:tip===t?"white":ink,borderRadius:4,cursor:"pointer",fontSize:13,fontWeight:600}}>
                        ${t}
                      </button>
                    ))}
                    <input value={customTip} onChange={e=>{setCustomTip(e.target.value);setTip(0);}} placeholder="Custom"
                      style={{width:80,padding:"8px 10px",border:"1px solid #DDD5C8",borderRadius:4,fontSize:13,background:cream,outline:"none",textAlign:"center"}}/>
                  </div>
                </div>

                <div style={{borderTop:"1px solid #DDD5C8",paddingTop:12,marginBottom:16}}>
                  <div style={{display:"flex",justifyContent:"space-between"}}>
                    <span style={{fontWeight:700,fontSize:15}}>Total</span>
                    <span style={{fontWeight:900,fontSize:18,color:rust}}>${total.toFixed(2)}</span>
                  </div>
                </div>

                <div style={{display:"flex",flexDirection:"column",gap:10}}>
                  <button onClick={payWithStripe} style={{background:"#635BFF",color:"white",border:"none",padding:"14px",borderRadius:6,cursor:"pointer",fontWeight:700,fontSize:15}}>
                    💳 Pay by Card / Apple Pay — ${total.toFixed(2)}
                  </button>
                  <button onClick={payVenmo} style={{background:"#008CFF",color:"white",border:"none",padding:"14px",borderRadius:6,cursor:"pointer",fontWeight:700,fontSize:15}}>
                    Pay with Venmo — ${total.toFixed(2)}
                  </button>
                  <button onClick={payCashApp} style={{background:"#00D632",color:"white",border:"none",padding:"14px",borderRadius:6,cursor:"pointer",fontWeight:700,fontSize:15}}>
                    Pay with CashApp — ${total.toFixed(2)}
                  </button>
                  <button onClick={()=>setPaid(true)} style={{background:"white",color:ink,border:"2px solid "+ink,padding:"14px",borderRadius:6,cursor:"pointer",fontWeight:700,fontSize:15}}>
                    💵 Pay Cash on Delivery
                  </button>
                  <p style={{fontSize:11,color:muted,textAlign:"center"}}>Card payment accepts Apple Pay & Google Pay</p>
                </div>
              </div>
            ) : (
              <div style={{background:"#D4EDDA",border:"1px solid #C3E6CB",borderRadius:8,padding:20,textAlign:"center"}}>
                <div style={{fontSize:36,marginBottom:8}}>🎉</div>
                <p style={{fontWeight:700,color:"#155724",fontSize:16}}>Payment sent!</p>
                <p style={{color:"#155724",fontSize:13,marginTop:4}}>Thank you for using DELIVERme!</p>
              </div>
            )}
          </>
        )}
        {notFound && <p style={{textAlign:"center",color:muted,fontSize:13,paddingTop:16}}>No order found with that ID.</p>}
      </main>
    </div>
  );
}

function NotFound() {
  return (
    <div style={{fontFamily:"system-ui,sans-serif",background:cream,minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center"}}>
      <div style={{textAlign:"center"}}>
        <p style={{fontSize:48,marginBottom:16}}>🤷</p>
        <p style={{color:muted}}>Restaurant not found. Check your link.</p>
        <a href="#" style={{color:rust,fontSize:13,marginTop:12,display:"block"}}>← Go Home</a>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
</script>
</body>
</html>
