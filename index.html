function getRoute() {
  const hash = window.location.hash.replace("#","");
  if (hash.startsWith("restaurant/")) return { view: "restaurant", slug: hash.replace("restaurant/","") };
  if (hash.startsWith("track/")) return { view: "track", orderId: hash.replace("track/","") };
  if (hash === "track") return { view: "track", orderId: "" };
  if (hash === "dashboard") return { view: "dashboard" };
  if (hash === "request") return { view: "request" };
  if (hash === "drive") return { view: "drive" };
  return { view: "home" };
}

let audioCtx = null;
function unlockAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === "suspended") audioCtx.resume();
}
function playChime() {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === "suspended") audioCtx.resume();
    const now = audioCtx.currentTime;
    [[523,0],[659,0.18],[784,0.36]].forEach(([freq, delay]) => {
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.connect(g); g.connect(audioCtx.destination);
      o.type = "sine";
      o.frequency.setValueAtTime(freq, now + delay);
      g.gain.setValueAtTime(0, now + delay);
      g.gain.linearRampToValueAtTime(0.5, now + delay + 0.01);
      g.gain.exponentialRampToValueAtTime(0.001, now + delay + 0.4);
      o.start(now + delay);
      o.stop(now + delay + 0.5);
    });
  } catch(e) { console.log("Audio error:", e); }
}

function App() {

  const [authed, setAuthed] = useState(!!sessionStorage.getItem("dm_authed"));
  useEffect(() => {
    const handler = () => setRoute(getRoute());
    window.addEventListener("hashchange", handler);
    return () => window.removeEventListener("hashchange", handler);
  }, []);
  const navigate = (hash) => { window.location.hash = hash; };
  if (route.view === "restaurant") {
    const restaurant = RESTAURANTS[route.slug];
    if (!restaurant) return <NotFound/>;
    return <RestaurantPortal restaurant={restaurant} slug={route.slug}/>;
  }
  if (route.view === "request") return <CustomerRequest navigate={navigate}/>;
  if (route.view === "drive") return <DriverSignup navigate={navigate}/>;
  if (route.view === "track") return <TrackingPage navigate={navigate} initialOrderId={route.orderId || ""}/>;
  if (route.view === "home") return <LandingPage navigate={navigate}/>;
  if (route.view === "dashboard") {
    if (!authed) return <PinEntry onSuccess={() => { sessionStorage.setItem("dm_authed","1"); setAuthed(true); }}/>;
    return <Dashboard navigate={navigate}/>;
  }
  return <LandingPage navigate={navigate}/>;
}

function Dashboard({ navigate }) {

    try {
      const data = await sb.getOrders();

      if (knownIds.current.size > 0 && newPendingOrders.length > 0) { playChime(); }
      data.forEach(o => knownIds.current.add(o.id));
      setOrders(data);
    } catch(e) {}
    finally { setLoading(false); }
  };

    loadOrders();
    const t = setInterval(loadOrders, 15000);
    return () => clearInterval(t);
  }, []);

    setAvailable(next);

function EarningsPanel() {
  const [orders, setOrders] = useState([]);
  const [loading, setLoading] = useState(true);
  const [period, setPeriod] = useState("week");
  useEffect(()=>{ sb.getOrders().then(data=>{ setOrders(data.filter(o=>o.status==="paid")); setLoading(false); }).catch(()=>setLoading(false)); },[]);
  const now = new Date();
  const startOf = (p) => {
    const d = new Date(now);
    if(p==="today") { d.setHours(0,0,0,0); return d; }
    if(p==="week") { d.setDate(d.getDate()-d.getDay()); d.setHours(0,0,0,0); return d; }
    if(p==="month") { d.setDate(1); d.setHours(0,0,0,0); return d; }
    return new Date(0);
  };
  const filtered = orders.filter(o => new Date(o.created_at) >= startOf(period));
  const total = filtered.reduce((sum, o) => sum + Number(o.delivery_fee || 8), 0);
  const count = filtered.length;
  const avg = count > 0 ? total / count : 0;
  const byDay = {};
  filtered.forEach(o => {
    const day = new Date(o.created_at).toLocaleDateString("en-US", {weekday:"short", month:"short", day:"numeric"});
    if (!byDay[day]) byDay[day] = { count: 0, total: 0 };
    byDay[day].count++;
    byDay[day].total += Number(o.delivery_fee || 8);
  });
  const days = Object.entries(byDay).reverse();
  return (
    <div className="fade-in">
      <div style={{marginBottom:16}}>
        <h2 style={{fontSize:20,fontWeight:900}}>💵 Earnings</h2>
        <p style={{fontSize:13,color:muted,marginTop:4}}>Based on paid orders</p>
      </div>
      <div style={{display:"flex",gap:6,marginBottom:16}}>
        {[{val:"today",label:"Today"},{val:"week",label:"This Week"},{val:"month",label:"This Month"},{val:"all",label:"All Time"}].map(p=>(
          <button key={p.val} onClick={()=>setPeriod(p.val)} style={{flex:1,padding:"8px 4px",border:"1px solid "+(period===p.val?ink:border),background:period===p.val?ink:"white",color:period===p.val?"white":muted,borderRadius:4,cursor:"pointer",fontSize:11,fontWeight:600}}>{p.label}</button>
        ))}
      </div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:10,marginBottom:16}}>
        {[{label:"Total Earned", val:"$"+total.toFixed(2), color:green},{label:"Deliveries", val:count, color:rust},{label:"Avg per Run", val:"$"+avg.toFixed(2), color:"#2980B9"}].map(s=>(
          <div key={s.label} style={{background:"white",border:"1px solid #DDD5C8",borderRadius:8,padding:"14px 10px",textAlign:"center"}}>
            <div style={{fontSize:20,fontWeight:900,color:s.color}}>{s.val}</div>
            <div style={{fontSize:10,color:muted,marginTop:4,textTransform:"uppercase",letterSpacing:".05em"}}>{s.label}</div>
          </div>
        ))}
      </div>
      {loading && <div style={{textAlign:"center",padding:"20px",color:muted}}>Loading...</div>}
      {!loading && days.length === 0 && (<div style={{textAlign:"center",padding:"30px",color:muted,fontSize:13}}>No paid orders in this period yet.</div>)}
      {days.length > 0 && (
        <div style={{display:"flex",flexDirection:"column",gap:8}}>
          <p style={{fontSize:11,color:muted,textTransform:"uppercase",letterSpacing:".08em",marginBottom:4}}>Daily Breakdown</p>
          {days.map(([day, data])=>(
            <div key={day} style={{background:"white",border:"1px solid #DDD5C8",borderRadius:8,padding:"12px 16px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
              <div><div style={{fontWeight:600,fontSize:14}}>{day}</div><div style={{fontSize:12,color:muted}}>{data.count} delivery{data.count!==1?"s":""}</div></div>
              <div style={{fontWeight:900,fontSize:18,color:green}}>${data.total.toFixed(2)}</div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function RatingsPanel() {
  const [ratings, setRatings] = useState([]);
  const [loading, setLoading] = useState(true);
  useEffect(()=>{ sb.getRatings().then(data=>{ setRatings(data); setLoading(false); }).catch(()=>setLoading(false)); },[]);
  const byRestaurant = {};
  ratings.forEach(r => { if (!byRestaurant[r.restaurant_name]) byRestaurant[r.restaurant_name] = []; byRestaurant[r.restaurant_name].push(r.rating); });
  const restaurantStats = Object.entries(byRestaurant).map(([name, ratingsList]) => {
    const avg = ratingsList.reduce((a,b)=>a+b,0) / ratingsList.length;
    return { name, avg, count: ratingsList.length };
  }).sort((a,b)=>b.avg-a.avg);
  const stars = (avg) => { const full = Math.round(avg); return "⭐".repeat(full) + (full < 5 ? "☆".repeat(5-full) : ""); };
  const label = (avg) => {
    if(avg>=4.5) return {text:"Excellent tipper", color:"#27AE60"};
    if(avg>=3.5) return {text:"Good tipper", color:"#2980B9"};
    if(avg>=2.5) return {text:"Average", color:"#F39C12"};
    if(avg>=1.5) return {text:"Rarely tips", color:"#E67E22"};
    return {text:"Never tips", color:"#DC3545"};
  };
  return (
    <div className="fade-in">
      <div style={{marginBottom:16}}>
        <h2 style={{fontSize:20,fontWeight:900}}>⭐ Restaurant Ratings</h2>
        <p style={{fontSize:13,color:"#7A7065",marginTop:4}}>Private — only you can see this</p>
      </div>
      {loading && <div style={{textAlign:"center",padding:"40px 0",color:"#7A7065"}}>Loading...</div>}
      {!loading && restaurantStats.length===0 && (<div style={{textAlign:"center",padding:"40px 0",color:"#7A7065",fontSize:13}}>No ratings yet. Rate restaurants after marking orders paid.</div>)}
      <div style={{display:"flex",flexDirection:"column",gap:10}}>
        {restaurantStats.map(r=>{
          const l = label(r.avg);
          return (
            <div key={r.name} className="card">
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                <div>
                  <div style={{fontWeight:700,fontSize:15,marginBottom:4}}>{r.name}</div>
                  <div style={{fontSize:16}}>{stars(r.avg)}</div>
                  <div style={{fontSize:12,marginTop:4,color:l.color,fontWeight:600}}>{l.text}</div>
                </div>
                <div style={{textAlign:"right"}}>
                  <div style={{fontSize:24,fontWeight:900,color:l.color}}>{r.avg.toFixed(1)}</div>
                  <div style={{fontSize:11,color:"#7A7065"}}>{r.count} order{r.count!==1?"s":""}</div>
                </div>
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

  const [submitted, setSubmitted] = useState(false);
  const [loading, setLoading] = useState(false);
  const [orderId, setOrderId] = useState(null);
  const [recentOrders, setRecentOrders] = useState([]);
  const [showOrders, setShowOrders] = useState(false);
  const [tipped, setTipped] = useState(false);
  const [available, setAvailable] = useState(true);

  const tipWithMethod = (amount) => { const link = STRIPE_TIPS[amount] || STRIPE_TIPS[1]; window.open(link, "_blank"); };

  const loadRecentOrders = async () => {
    if (!restaurantName) return;

  };
  useEffect(() => { if (showOrders) loadRecentOrders(); }, [showOrders]);

  const statusColors = {
    pending:{bg:"#FFF3CD",text:"#856404",dot:"#FFC107"}, ready_for_pickup:{bg:"#FFE8D6",text:"#B94A00",dot:"#FF6B1A"},
    active:{bg:"#D1ECF1",text:"#0C5460",dot:"#17A2B8"}, picked_up:{bg:"#E8D5F5",text:"#6B1FA3",dot:"#9B59B6"},
    delivered:{bg:"#D4EDDA",text:"#155724",dot:"#28A745"}, cancelled:{bg:"#F8D7DA",text:"#721C24",dot:"#DC3545"}
  };
  const statusLabel = { pending:"⏳ Waiting for driver", active:"✅ Driver accepted — prepare order", ready_for_pickup:"🚗 Driver on the way", picked_up:"📦 Order picked up", delivered:"✓ Delivered", cancelled:"✗ Cancelled" };
  function timeAgo(iso) { const d=Math.floor((Date.now()-new Date(iso))/1000); if(d<60) return d+"s ago"; if(d<3600) return Math.floor(d/60)+"m ago"; return Math.floor(d/3600)+"h ago"; }
  const handleChange = e => setForm(prev=>({...prev,[e.target.name]:e.target.value}));

  const submit = async () => {
    if(!form.customerName||!form.customerPhone||!form.dropoffAddress) return;
    if(isGeneral && !form.restaurantName) return;
    setLoading(true);
    try {
      const order = { restaurant_name: form.restaurantName || restaurant.name, restaurant_address: form.restaurantAddress || restaurant.address, restaurant_slug: slug, customer_name:form.customerName, customer_phone:form.customerPhone, dropoff_address:form.dropoffAddress, order_details:form.orderDetails, notes:form.notes, delivery_fee:parseFloat(form.deliveryFee)||8, status:"pending", created_at:new Date().toISOString() };
      const [created] = await sb.createOrder(order);
      setOrderId(created.id);
      sendSMS("+19296908573","🚗 New delivery from "+(form.restaurantName||restaurant.name)+"!\nCustomer: "+form.customerName+" ("+form.customerPhone+")\nDrop-off: "+form.dropoffAddress+"\nFee: $"+form.deliveryFee);
      setSubmitted(true);
    } catch(e) { alert("Error submitting. Please try again."); }
    finally { setLoading(false); }
  };

  if (submitted) {
    return (
      <div style={{fontFamily:"system-ui,sans-serif",background:cream,minHeight:"100vh",padding:24}}>
        <div style={{maxWidth:400,margin:"0 auto",paddingTop:40}}>
          <div style={{textAlign:"center",marginBottom:24}}>
            <div style={{fontSize:56,marginBottom:12}}>✓</div>

            {orderId && <p style={{fontSize:12,color:muted}}>Order ID: <strong>{orderId.slice(0,8).toUpperCase()}</strong></p>}
          </div>
          <div style={{background:"#FFF3CD",border:"1px solid #FFC107",borderRadius:8,padding:14,textAlign:"center",marginBottom:16}}>
            <p style={{fontSize:13,color:"#856404",fontWeight:600}}>⏳ Waiting for your driver to accept. Once accepted, you can mark the order ready in "Recent Orders" below.</p>

              <div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:12}}>

              </div>
              <button onClick={()=>{window.open(STRIPE_TIPS[1], "_blank");setTipped(true);}} style={{width:"100%",background:"white",color:"#635BFF",border:"1px solid #635BFF",padding:"10px",borderRadius:4,cursor:"pointer",fontSize:13,fontWeight:600}}>💳 Custom amount — tap to enter quantity</button>
            </div>
          ) : (
            <div style={{background:"#D4EDDA",border:"1px solid #C3E6CB",borderRadius:8,padding:16,textAlign:"center",marginBottom:16}}><p style={{fontWeight:700,color:"#155724"}}>🎉 Thanks for the tip!</p></div>
          )}
          <button onClick={()=>{setSubmitted(false);setOrderId(null);setTipped(false);setForm({restaurantName:form.restaurantName,restaurantAddress:form.restaurantAddress,customerName:"",customerPhone:"",dropoffAddress:"",orderDetails:"",notes:"",deliveryFee:restaurant.defaultFee});}} style={{width:"100%",background:"none",color:muted,border:"1px solid #DDD5C8",padding:"11px",fontSize:13,borderRadius:6,cursor:"pointer"}}>New Request</button>
        </div>
      </div>
    );
  }

  return (
    <div style={{fontFamily:"system-ui,sans-serif",background:cream,minHeight:"100vh",color:ink}}>
      <style>{`*{box-sizing:border-box;margin:0;padding:0} input,textarea{font-family:inherit}`}</style>
      <header style={{background:"white",borderBottom:"1px solid #DDD5C8",padding:"14px 20px"}}>
        <div style={{maxWidth:520,margin:"0 auto"}}>
          <span style={{fontWeight:900,color:rust,fontSize:16}}>DELIVER</span>
          <span style={{fontWeight:700,color:ink,fontSize:16}}>me</span>
          <span style={{fontSize:11,color:muted,marginLeft:8}}>· Restaurant Portal</span>
        </div>
      </header>
      <main style={{maxWidth:520,margin:"0 auto",padding:"24px 16px"}}>
        <div style={{marginBottom:16}}>
          <h1 style={{fontSize:24,fontWeight:900}}>{restaurant.name || form.restaurantName || "Restaurant Portal"}</h1>
          <p style={{color:muted,fontSize:13,marginTop:4}}>{restaurant.address}</p>

          <div style={{background:"#F8D7DA",border:"1px solid #DC3545",borderRadius:8,padding:16,marginBottom:16,textAlign:"center"}}>

            <div>
              <label style={{display:"block",fontSize:11,letterSpacing:".1em",textTransform:"uppercase",color:muted,marginBottom:5}}>Restaurant Name *</label>

            </div>
            <div>
              <label style={{display:"block",fontSize:11,letterSpacing:".1em",textTransform:"uppercase",color:muted,marginBottom:5}}>Restaurant Address</label>

            </div>
            <div style={{borderTop:"1px solid #DDD5C8",paddingTop:4}}/>
          </>}
          {[{label:"Customer Name *",name:"customerName",placeholder:"Jane Smith",type:"text"},{label:"Customer Phone *",name:"customerPhone",placeholder:"(860) 555-0000",type:"tel"},{label:"Drop-off Address *",name:"dropoffAddress",placeholder:"123 Main St, North Canaan, CT",type:"text"}].map(f=>(
            <div key={f.name}>
              <label style={{display:"block",fontSize:11,letterSpacing:".1em",textTransform:"uppercase",color:muted,marginBottom:5}}>{f.label}</label>
              <input name={f.name} value={form[f.name]} onChange={handleChange} placeholder={f.placeholder} type={f.type} style={{width:"100%",padding:"10px 12px",border:"1px solid #DDD5C8",borderRadius:4,fontSize:14,background:cream,color:ink,outline:"none"}}/>
            </div>
          ))}
          <div>
            <label style={{display:"block",fontSize:11,letterSpacing:".1em",textTransform:"uppercase",color:muted,marginBottom:5}}>Order Details</label>
            <textarea name="orderDetails" value={form.orderDetails} onChange={handleChange} placeholder="2x Margherita, 1x Caesar salad..." rows={3} style={{width:"100%",padding:"10px 12px",border:"1px solid #DDD5C8",borderRadius:4,fontSize:14,background:cream,color:ink,outline:"none",resize:"vertical",fontFamily:"inherit"}}/>
          </div>
          <div>
            <label style={{display:"block",fontSize:11,letterSpacing:".1em",textTransform:"uppercase",color:muted,marginBottom:5}}>Notes</label>
            <input name="notes" value={form.notes} onChange={handleChange} placeholder="Leave at door, call on arrival..." style={{width:"100%",padding:"10px 12px",border:"1px solid #DDD5C8",borderRadius:4,fontSize:14,background:cream,color:ink,outline:"none"}}/>
          </div>
          <div style={{borderTop:"1px solid #DDD5C8",paddingTop:16,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <span style={{fontSize:12,color:muted}}>Pickup: <strong>{form.restaurantName || restaurant.name || "Your Restaurant"}</strong></span>
            <button onClick={submit} disabled={loading||!available||!form.customerName||!form.customerPhone||!form.dropoffAddress||(isGeneral&&!form.restaurantName)} style={{background:(loading||!available||!form.customerName||!form.customerPhone||!form.dropoffAddress)?"#ccc":rust,color:"white",border:"none",padding:"11px 22px",fontSize:13,borderRadius:6,cursor:"pointer",fontWeight:600}}>{!available ? "Offline" : loading ? "Sending..." : "Request Delivery →"}</button>
          </div>
        </div>
        <div style={{marginTop:32}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
            <h2 style={{fontSize:18,fontWeight:700}}>Recent Orders</h2>
            <button onClick={()=>{ setShowOrders(true); loadRecentOrders(); }} style={{background:"none",border:"1px solid #DDD5C8",padding:"6px 14px",borderRadius:4,fontSize:12,cursor:"pointer",color:muted}}>↻ Refresh</button>
          </div>
          {!showOrders && (<div style={{textAlign:"center",padding:"24px 0",color:muted,fontSize:13}}><button onClick={()=>{ setShowOrders(true); loadRecentOrders(); }} style={{background:ink,color:"white",border:"none",padding:"10px 20px",borderRadius:6,cursor:"pointer",fontSize:13}}>View My Orders</button></div>)}
          {showOrders && recentOrders.length === 0 && (<div style={{textAlign:"center",padding:"24px 0",color:muted,fontSize:13}}>No orders yet</div>)}
          {showOrders && recentOrders.map(order => {
            const sc = statusColors[order.status] || statusColors.pending;
            return (
              <div key={order.id} style={{background:"white",border:"1px solid #DDD5C8",borderRadius:6,padding:16,marginBottom:10}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",flexWrap:"wrap",gap:8}}>
                  <div style={{flex:1}}>
                    <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:6}}>
                      <strong style={{fontSize:14}}>{order.customer_name}</strong>
                      <span style={{display:"inline-flex",alignItems:"center",gap:4,padding:"3px 10px",borderRadius:20,fontSize:11,fontWeight:600,background:sc.bg,color:sc.text}}><span style={{width:6,height:6,borderRadius:"50%",background:sc.dot,display:"inline-block"}}/>{statusLabel[order.status] || order.status}</span>
                    </div>
                    <div style={{fontSize:12,color:muted}}>📍 {order.dropoff_address}</div>
                    {order.order_details && <div style={{fontSize:12,color:muted}}>🧾 {order.order_details}</div>}
                  </div>
                  <div style={{textAlign:"right"}}><div style={{fontSize:11,color:muted}}>{timeAgo(order.created_at)}</div></div>
                </div>
                {(order.status === "delivered" || order.status === "cancelled" || order.status === "paid") && (
                  <button onClick={async()=>{ if(confirm("Remove this order from your list?")) { try { await sb.deleteOrder(order.id); loadRecentOrders(); } catch(e){ alert("Failed to delete."); } } }} style={{marginTop:8,width:"100%",background:"none",color:"#DC3545",border:"1px solid #DC3545",padding:"6px",borderRadius:4,cursor:"pointer",fontSize:12,fontWeight:600}}>🗑 Remove Order</button>
                )}
                {order.status === "pending" && (
                  <div style={{marginTop:10,padding:"8px",background:"#FFF3CD",borderRadius:4,textAlign:"center",fontSize:12,color:"#856404",fontWeight:600}}>⏳ Waiting for driver to accept</div>
                )}
                {order.status === "active" && (
                  <button onClick={async()=>{ try { await sb.updateOrder(order.id,{status:"ready_for_pickup"}); loadRecentOrders(); } catch(e){} }} style={{marginTop:10,background:"#FF6B1A",color:"white",border:"none",padding:"8px 16px",fontSize:12,borderRadius:4,cursor:"pointer",fontWeight:600,width:"100%"}}>🍔 Order is Ready for Pickup</button>
                )}
                {order.status !== "cancelled" && (
                  <div style={{marginTop:8}}>
                    <p style={{fontSize:11,color:muted,marginBottom:8,textTransform:"uppercase",letterSpacing:".05em"}}>💝 Tip your driver</p>
                    <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:6}}>
                      {[1,2,3,5].map(t=>(<button key={t} onClick={()=>tipWithMethod(t)} style={{flex:1,padding:"7px 4px",border:"none",background:"#635BFF",color:"white",borderRadius:4,cursor:"pointer",fontSize:12,fontWeight:600}}>${t}</button>))}
                    </div>
                    <div style={{display:"flex",alignItems:"center",gap:6}}>
                      <button onClick={()=>window.open(STRIPE_DELIVERY, "_blank")} style={{width:"100%",padding:"7px",border:"1px solid #635BFF",background:"white",color:"#635BFF",borderRadius:4,cursor:"pointer",fontSize:12,fontWeight:600}}>💳 Custom amount — tap to enter</button>
                    </div>
                  </div>
                )}
              </div>
            );
          })}
        </div>
      </main>
    </div>
  );
}

  );
}

function TrackingPage({ navigate, initialOrderId }) {
  const [orderId, setOrderId] = useState(initialOrderId || "");
  const [tracked, setTracked] = useState(null);
  const [loading, setLoading] = useState(false);
  const [notFound, setNotFound] = useState(false);
  const [paid, setPaid] = useState(false);
  const [cashSelected, setCashSelected] = useState(false);
  const DELIVERY_FEE = 8;
  const track = async (id) => {
    const searchId = (id || orderId).trim();
    if (!searchId) return;
    setLoading(true); setNotFound(false); setTracked(null);
    try {
      const all = await sb.getOrders();
      const found = all.find(o => o.id === searchId || o.id.slice(0,8).toUpperCase() === searchId.toUpperCase()) || null;
      found ? setTracked(found) : setNotFound(true);
    } catch { setNotFound(true); }
    finally { setLoading(false); }
  };
  useEffect(() => { if (initialOrderId) track(initialOrderId); }, []);
  const payWithStripe = () => window.open("https://buy.stripe.com/3cI5kC81Z4IDeEe4Vgd3i00?client_reference_id="+tracked.id.slice(0,8)+"&locale=auto", "_blank");
  const steps = ["Order Received","Driver Accepted","Picked Up","On The Way","Delivered"];
  const stepIndex = !tracked ? 0 : tracked.status==="pending" ? 1 : tracked.status==="active" || tracked.status==="ready_for_pickup" ? 2 : tracked.status==="picked_up" ? 4 : tracked.status==="delivered" ? 5 : 0;
  return (
    <div style={{fontFamily:"system-ui,sans-serif",background:cream,minHeight:"100vh",color:ink}}>
      <style>{`*{box-sizing:border-box;margin:0;padding:0}`}</style>
      <header style={{background:"white",borderBottom:"1px solid #DDD5C8",padding:"14px 20px"}}>
        <div style={{maxWidth:480,margin:"0 auto",display:"flex",alignItems:"center",justifyContent:"space-between"}}>
          <div><span style={{fontWeight:900,color:rust,fontSize:16}}>DELIVER</span><span style={{fontWeight:700,color:ink,fontSize:16}}>me</span></div>
          <button onClick={()=>navigate("")} style={{background:"none",border:"none",color:muted,fontSize:13,cursor:"pointer"}}>← Home</button>
        </div>
      </header>
      <main style={{maxWidth:480,margin:"0 auto",padding:"24px 16px"}}>
        <h1 style={{fontSize:24,fontWeight:900,marginBottom:20}}>Track Your Delivery</h1>
        <div style={{background:"white",border:"1px solid #DDD5C8",borderRadius:8,padding:20,marginBottom:16}}>
          <label style={{display:"block",fontSize:11,letterSpacing:".1em",textTransform:"uppercase",color:muted,marginBottom:6}}>Order ID</label>
          <div style={{display:"flex",gap:10}}>
            <input value={orderId} onChange={e=>setOrderId(e.target.value)} onKeyDown={e=>e.key==="Enter"&&track()} placeholder="Enter your order ID" style={{flex:1,padding:"10px 12px",border:"1px solid #DDD5C8",borderRadius:4,fontSize:14,background:cream,outline:"none"}}/>
            <button onClick={()=>track()} disabled={loading||!orderId} style={{background:rust,color:"white",border:"none",padding:"10px 18px",borderRadius:4,cursor:"pointer",fontWeight:600,fontSize:13}}>{loading ? "..." : "Track"}</button>
          </div>
        </div>
        {tracked && (
          <>
            <div style={{background:"white",border:"1px solid #DDD5C8",borderRadius:8,padding:20,marginBottom:16}}>
              <div style={{marginBottom:16}}>
                <div style={{fontWeight:700,fontSize:16}}>{tracked.restaurant_name}</div>
                <div style={{fontSize:13,color:muted,marginTop:4}}>To: {tracked.dropoff_address}</div>
                <div style={{fontSize:13,color:muted}}>For: {tracked.customer_name}</div>
              </div>
              {steps.map((step,i) => {
                const done=i<stepIndex, active=i===stepIndex-1;
                return (
                  <div key={step} style={{display:"flex",alignItems:"center",gap:14}}>
                    <div style={{display:"flex",flexDirection:"column",alignItems:"center",width:20}}>
                      <div style={{width:20,height:20,borderRadius:"50%",background:done||active?rust:"#DDD5C8",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
                        {done && <span style={{color:"white",fontSize:10}}>✓</span>}
                        {active && <span style={{width:8,height:8,borderRadius:"50%",background:"white",display:"block"}}/>}
                      </div>
                      {i<steps.length-1 && <div style={{width:2,height:28,background:done?rust:"#DDD5C8"}}/>}
                    </div>
                    <div style={{paddingBottom:i<steps.length-1?20:0}}><div style={{fontSize:13,fontWeight:active?700:400,color:done||active?ink:muted}}>{step}</div></div>
                  </div>
                );
              })}
            </div>
            {!paid ? (
              <div style={{background:"white",border:"1px solid #DDD5C8",borderRadius:8,padding:20}}>
                <h3 style={{fontSize:16,fontWeight:700,marginBottom:16}}>💳 Pay Delivery Fee</h3>
                <div style={{display:"flex",justifyContent:"space-between",marginBottom:4}}>
                  <span style={{fontSize:14,color:muted}}>Delivery fee</span>
                  <span style={{fontSize:14,fontWeight:600}}>${DELIVERY_FEE.toFixed(2)}</span>
                </div>
                <div style={{borderTop:"1px solid #DDD5C8",paddingTop:12,marginBottom:16,marginTop:12}}>
                  <div style={{display:"flex",justifyContent:"space-between"}}>
                    <span style={{fontWeight:700,fontSize:15}}>Total</span>
                    <span style={{fontWeight:900,fontSize:18,color:rust}}>${DELIVERY_FEE.toFixed(2)}</span>
                  </div>
                  <p style={{fontSize:11,color:muted,marginTop:6}}>Want to tip? You can add a tip on the card screen, or hand it to your driver directly.</p>
                </div>
                <div style={{display:"flex",flexDirection:"column",gap:10}}>
                  <button onClick={payWithStripe} style={{background:"#635BFF",color:"white",border:"none",padding:"14px",borderRadius:6,cursor:"pointer",fontWeight:700,fontSize:15}}>💳 Pay by Card / Apple Pay — ${DELIVERY_FEE.toFixed(2)}</button>
                  <button onClick={()=>setCashSelected(true)} style={{background:"white",color:ink,border:"2px solid "+ink,padding:"14px",borderRadius:6,cursor:"pointer",fontWeight:700,fontSize:15}}>💵 Pay Cash on Delivery</button>
                  {cashSelected && (
                    <div style={{background:"#FFF3CD",border:"1px solid #FFC107",borderRadius:6,padding:12,textAlign:"center"}}>
                      <p style={{fontWeight:700,color:"#856404"}}>💵 Cash selected</p>
                      <p style={{fontSize:13,color:"#856404",marginTop:4}}>Please have <strong>${DELIVERY_FEE.toFixed(2)}</strong> ready for the driver at drop-off.</p>
                    </div>
                  )}
                  <div style={{borderTop:"1px solid #DDD5C8",paddingTop:10,marginTop:4}}>
                    <p style={{fontSize:12,color:muted,textAlign:"center",marginBottom:8}}>After completing your card payment tap below</p>
                    <button onClick={()=>setPaid(true)} style={{width:"100%",background:"#27AE60",color:"white",border:"none",padding:"14px",borderRadius:6,cursor:"pointer",fontWeight:700,fontSize:15}}>✓ I've Completed My Payment</button>
                  </div>
                  <p style={{fontSize:11,color:muted,textAlign:"center"}}>Card accepts Apple Pay & Google Pay</p>
                </div>
              </div>
            ) : (
              <div style={{background:"#D4EDDA",border:"1px solid #C3E6CB",borderRadius:8,padding:20,textAlign:"center"}}>
                <div style={{fontSize:36,marginBottom:8}}>🎉</div>
                <p style={{fontWeight:700,color:"#155724",fontSize:16}}>Payment confirmed!</p>
                <p style={{color:"#155724",fontSize:13,marginTop:4}}>Thank you for using DELIVERme!</p>
              </div>
            )}
          </>
        )}
        {notFound && <p style={{textAlign:"center",color:muted,fontSize:13,paddingTop:16}}>No order found with that ID.</p>}
      </main>
    </div>
  );
}

function NotFound() {
  return (
    <div style={{fontFamily:"system-ui,sans-serif",background:cream,minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center"}}>
      <div style={{textAlign:"center"}}>
        <p style={{fontSize:48,marginBottom:16}}>🤷</p>
        <p style={{color:muted}}>Restaurant not found. Check your link.</p>
        <a href="#" style={{color:rust,fontSize:13,marginTop:12,display:"block"}}>← Go Home</a>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
</script>
</body>
</html>
